name: CI - Auto Schedule Timetable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run timetable scheduler
        run: python main.py

      - name: Verify output file exists
        run: |
          if [ -f "Thoi_Khoa_Bieu_Truong_9_Lop.xlsx" ]; then
            echo "✅ Output file generated successfully."
            ls -lh Thoi_Khoa_Bieu_Truong_9_Lop.xlsx
          else
            echo "❌ Output file not found!"
            exit 1
          fi

      - name: Upload timetable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-output
          path: Thoi_Khoa_Bieu_Truong_9_Lop.xlsx
          retention-days: 7

